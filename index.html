<!doctype html>
<html lang="ta" class="text-size-normal">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>StrokeCare AI — Stroke Recovery &amp; 3D Care Guide</title>
  <meta name="description" content="Bilingual Tamil and English stroke recovery app with 3D brain atlas, daily goal tracking, physiotherapy timers, medication alerts, speech practice, and SOS 108." />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#1F6F63" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- OpenGraph Social Metadata -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="StrokeCare AI" />
  <meta property="og:locale" content="ta_IN" />
  <meta property="og:locale:alternate" content="en_US" />
  <meta property="og:title" content="StrokeCare AI — Guided Stroke Recovery &amp; 3D Brain Atlas" />
  <meta property="og:description" content="Accessible bilingual Tamil and English stroke recovery support with interactive 3D brain anatomy, physiotherapy timers, medication reminders, 3D AI companion, and Emergency SOS 108." />

  <!-- Twitter Card Metadata -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="StrokeCare AI — Stroke Recovery &amp; 3D Care Guide" />
  <meta name="twitter:description" content="Calm bilingual stroke recovery companion featuring 3D brain explorer, daily trackers, medication chimes, speech practice, and Emergency SOS 108." />

  <!-- Structured Data (Schema.org WebApplication + FAQPage) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebApplication",
          "name": "StrokeCare AI",
          "applicationCategory": "HealthApplication",
          "operatingSystem": "Web",
          "inLanguage": ["ta", "en"],
          "description": "Bilingual Tamil and English post-stroke recovery companion featuring 3D brain visualization, 5-second guided physiotherapy timers, medication alerts, hydration tracking, speech therapy cards, and 3D AI care assistant.",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "INR"
          }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Does StrokeCare AI replace professional medical advice?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. StrokeCare AI is designed strictly for daily recovery tracking, education, and F.A.S.T. awareness. Always follow your doctor's prescription and consult your neurologist."
              }
            },
            {
              "@type": "Question",
              "name": "How can I switch between Tamil and English?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Tap the [EN | தமிழ்] selector in the top navigation bar at any time to switch every label, guide, and spoken audio cue."
              }
            },
            {
              "@type": "Question",
              "name": "Where are my medication and exercise logs stored?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "All progress, medication check-offs, water intake, and schedules stay privately inside your device browser and are never uploaded."
              }
            },
            {
              "@type": "Question",
              "name": "Can elderly users enlarge text or turn on high contrast?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Tap the bottom-right Accessibility button to cycle A / A+ / A++ text sizes, switch Light/Dark themes, or enable High Contrast mode."
              }
            }
          ]
        }
      ]
    }
  </script>

  <!-- Google Fonts: Noto Sans + Noto Sans Tamil (400, 500, 600) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body class="antialiased min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
